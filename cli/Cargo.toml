[package]
name = "aptove"
version = "1.4.3"
edition = "2021"
authors = ["Saltuk Alakus <saltukalakus@gmail.com>"]
description = "A secure bridge between ACP agents and mobile apps"
repository = "https://github.com/aptove/aptove"
license = "Apache-2.0"
homepage = "https://github.com/aptove/aptove"
readme = "../README.md"

[[bin]]
name = "aptove"
path = "src/main.rs"

[dependencies]
aptove-core = { path = "../core", version = "1.4.3" }
tokio = { version = "1.35", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
anyhow = "1.0"
local-ip-address = "0.6"
crossterm = "0.29"
self_update = { version = "1", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "archive-tar",
    "compression-tar-gz",
    "compression-tar-xz",
    "archive-zip",
    "compression-zip-deflate",
] }
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
